<!DOCTYPE html>
<html lang="en">
<head>
    <title>E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <div class="container mt-4">
    <div class="row align-items-center">
    <div class="col-md-8">
        <input
           type="text" class="form-control" id="search"  placeholder="Search Products...">
    </div>
    <div class="col-md-4 text-end mt-n20">
        <button id="wishlistBtn" class="btn btn-outline-danger position-relative">
            <i class="fa-solid fa-heart"></i>
            <span id="wishlistCount">0</span>
        </button>
        <button id="cartBtn" class="btn btn-outline-primary position-relative ms-3">
             <i class="fa-solid fa-cart-shopping"></i>
             <span id="cartCount">0</span>
        </button>
    </div>
    <hr>
    <div class="row" id="productContainer">

    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
