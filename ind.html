<!DOCTYPE html>
<html>
    <head>
        <title> Counter </title>
    </head>
    <body>
        <h1>Counter function in javascript</h1>
        <p id="demo">0</p>
        <button type="button" onclick="myFunction()">Click me</button>
        <script>
            let count = 0;
            function myFunction() {
                count++;
                document.getElementById("demo").innerHTML = count;
            }
        </script>
    </body>
</html>
