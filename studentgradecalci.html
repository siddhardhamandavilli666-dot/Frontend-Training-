<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Remove arrows in Chrome, Edge, Safari */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Remove arrows in Firefox */
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 15px;
        }

        .card-header {
            border-radius: 15px 15px 0 0 !important;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h3>Student Grade Calculator</h3>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Subject 1</label>
                        <input type="number"
                               id="sub1"
                               class="form-control"
                               placeholder="Enter Marks"
                               onkeydown="moveNext(event,'sub2')">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject 2</label>
                        <input type="number"
                               id="sub2"
                               class="form-control"
                               placeholder="Enter Marks"
                               onkeydown="moveNext(event,'sub3')">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject 3</label>
                        <input type="number"
                               id="sub3"
                               class="form-control"
                               placeholder="Enter Marks"
                               onkeydown="moveNext(event,'sub4')">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject 4</label>
                        <input type="number"
                               id="sub4"
                               class="form-control"
                               placeholder="Enter Marks"
                               onkeydown="moveNext(event,'sub5')">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject 5</label>
                        <input type="number"
                               id="sub5"
                               class="form-control"
                               placeholder="Enter Marks"
                               onkeydown="if(event.key==='Enter'){event.preventDefault();calculateGrade();}">
                    </div>

                    <div class="d-grid">
                        <button id="btnCalculate"
                                class="btn btn-primary"
                                onclick="calculateGrade()">
                            Calculate Grade
                        </button>
                    </div>

                    <div id="result" class="alert alert-success mt-4 d-none"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

function moveNext(event, nextId) {
    if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById(nextId).focus();
    }
}

function calculateGrade() {

    let s1 = Number(document.getElementById("sub1").value);
    let s2 = Number(document.getElementById("sub2").value);
    let s3 = Number(document.getElementById("sub3").value);
    let s4 = Number(document.getElementById("sub4").value);
    let s5 = Number(document.getElementById("sub5").value);

    
    if (
        document.getElementById("sub1").value === "" ||
        document.getElementById("sub2").value === "" ||
        document.getElementById("sub3").value === "" ||
        document.getElementById("sub4").value === "" ||
        document.getElementById("sub5").value === ""
    ) {
        alert("Please enter marks for all subjects.");
        return;
    }

   
    if (
        s1 < 0 || s1 > 100 ||
        s2 < 0 || s2 > 100 ||
        s3 < 0 || s3 > 100 ||
        s4 < 0 || s4 > 100 ||
        s5 < 0 || s5 > 100
    ) {
        alert("Marks should be between 0 and 100.");
        return;
    }

    let total = s1 + s2 + s3 + s4 + s5;
    let average = total / 5;
    let percentage = average;
    let grade;

    if (percentage >= 90) {
        grade = "A+";
    } else if (percentage >= 80) {
        grade = "A";
    } else if (percentage >= 70) {
        grade = "B";
    } else if (percentage >= 60) {
        grade = "C";
    } else if (percentage >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    document.getElementById("result").classList.remove("d-none");

    document.getElementById("result").innerHTML = `
        <h4 class="text-center">Result</h4>
        <hr>
        <p><strong>Total Marks:</strong> ${total} / 500</p>
        <p><strong>Average:</strong> ${average.toFixed(2)}</p>
        <p><strong>Percentage:</strong> ${percentage.toFixed(2)}%</p>
        <p><strong>Grade:</strong> ${grade}</p>
    `;
}

</script>

</body>
</html>
