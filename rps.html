<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissor</title>
</head>
<body>
<h1>Rock Paper Scissor</h1>
<button onclick="playGame('rock')">Rock</button>
<button onclick="playGame('paper')">Paper</button>
<button onclick="playGame('scissor')">Scissor</button>
<button onclick="score.wins=0;score.losses=0;score.tie=0; localStorage.removeItem('score');">Reset Score</button>
<script>
    const score=JSON.parse(localStorage.getItem('score')) || {
         wins:0,
         losses:0,
         tie:0,
    };
function playGame(playerMove) {
    const rn = Math.random();
    let computerMove = '';
    if (rn < 1/3) {
        computerMove = 'rock';
    } 
    else if (rn < 2/3) {
        computerMove = 'paper';
    } 
    else {
        computerMove = 'scissor';
    }
    let result = '';
    if (playerMove === 'rock') {
        if (computerMove === 'rock') {
            result = 'Tie';
        } 
        else if (computerMove === 'paper') {
            result = 'You Lose';
        } 
        else {
            result = 'You Win';
        }
    }
    if (playerMove === 'paper') {
        if (computerMove === 'rock') {
            result = 'You Win';
        } 
        else if (computerMove === 'paper') {
            result = 'Tie';
        } 
        else {
            result = 'You Lose';
        }
    }
    if (playerMove === 'scissor') {
        if (computerMove === 'rock') {
            result = 'You Lose';
        } 
        else if (computerMove === 'paper') {
            result = 'You Win';
        } 
        else {
            result = 'Tie';
        }
    }
    if(result === 'You Win'){
        score.wins++;
    }
    else if(result === 'You Lose'){
        score.losses++;
    }
    else{
        score.tie++;
    }
    localStorage.setItem('score',JSON.stringify(score));
    alert(`You picked ${playerMove}. Computer picked ${computerMove}=> ${result}` + `\nWins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.tie}` );
}
</script>
</body>
</html>
