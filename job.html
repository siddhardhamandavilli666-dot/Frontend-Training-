<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application</title>
</head>
<body>
    <div style="width:500px; margin:200px auto; border:1px solid black; padding:20px;">
        <h1>Job Application</h1>
        <form action="" method="post">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div><br>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div><br>
            <div>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required min="21" max="50">
            </div><br>
            <div>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            </div><br>
            <div>
                <label for="gender">Gender:</label>
                <input type="radio" id="male" class="gender" name="gender" value="male" >
                <label for="male">Male</label>
                <input type="radio" id="female" class="gender" name="gender" value="female" >
                <label for="female">Female</label>
            </div><br>
            <div>
                <label for="skills">Skills:</label>
                <input type="checkbox" id="html" class="skills" name="skills" value="html">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" class="skills" name="skills" value="css">
                <label for="css">CSS</label>
                <input type="checkbox" id="react.js" class="skills" name="skills" value="react.js">
                <label for="react.js">React.js</label>
                <input type="checkbox" id="javascript" class="skills" name="skills" value="javascript">
                <label for="javascript">Javascript</label>
            </div><br>
            <div>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
</body>
</html>
