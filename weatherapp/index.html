<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-uKxGJg+1VpGSeW0FNkQZb7EG6hw2t1x0v+1MZ1M7BdA0Y47K6b4VY1GfESRw4J9p" crossorigin="anonymous">
  <link rel="stylesheet" href="style6.css" />
</head>
<body>

  <div class="container">

    <!-- Top row: title + C/F toggle -->
    <div class="top-row">
      <h1 class="title">Weather App</h1>
      <button id="unit-toggle" class="unit-toggle">°C</button>
    </div>

    <!-- Search + My location -->
    <div class="search-row">
      <div class="search-box">
        <input
          type="text"
          id="city-input"
          list="city-list"
          placeholder="Enter city name"
        />
        <button id="search-btn">
          <img src="images/search.png" />
        </button>
      </div>

      <button id="loc-btn" class="location-btn">My location</button>
    </div>

    <!-- Some popular city suggestions -->
    <datalist id="city-list">
      <option value="Hyderabad"></option>
      <option value="Mumbai"></option>
      <option value="Delhi"></option>
      <option value="Chennai"></option>
      <option value="Bengaluru"></option>
      <option value="London"></option>
      <option value="New York"></option>
      <option value="Tokyo"></option>
      <option value="Sydney"></option>
      <option value="Dubai"></option>
    </datalist>

    <p class="error"></p>

    <div class="card">
      <img src="images/clear.png" class="weather-icon" />

      <div class="city-row">
        <img class="flag" src="" alt="" />
        <h2 class="city">City Name</h2>
      </div>

      <h1 class="temp">--°C</h1>

      <div class="details">
        <div class="col">
          <img src="images/humidity.png" />
          <div>
            <h3 class="humidity">--%</h3>
            <p>Humidity</p>
          </div>
        </div>

        <div class="col">
          <img src="images/wind.png" />
          <div>
            <h3 class="wind">-- km/h</h3>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>

      <h3 class="forecast-title">5-Day Forecast</h3>
      <div class="forecast" id="forecast">
        <!-- forecast items will be added from JS -->
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
